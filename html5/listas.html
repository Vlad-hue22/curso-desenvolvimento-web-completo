<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas ordenadas e não ordenadas</title>
</head>
<body>
    

<!--
    ul -> Unorderd list (lista não ordenada)
    ol -> Ordered List (lista ordenada)
    li -> Lista Item (item da lista)
-->
    <h2>Lista não ordenada (menus)</h2>
    <ul>
        <li>Véiculos</li>
        <li>
            Tecnologia
            <ul>
                <li>Celulares e telefones</li>
                <li>Câmeras e acessórios</li>
            </ul>
        </li>
    
    </ul>

    <h2>Lista ordenada (lista de compras )</h2>
        <ol style="list-style-type: lower-greek">
            <li>Melancia</li>
            <li>Molho de tomate</li>
            <li>Macarrão</li>
            <li>
                Geléia
                <ol>
                    <li>Sub item de geléia</li>
                    <li>Sub item de geléia</li>
                    <li>Sub item de geléia</li>
                </ol>
            </li>
        </ol>

</body>
</html>
